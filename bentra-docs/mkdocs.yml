site_name: Bentra Docs
site_description: Process, architecture, and roadmap for Bentra.

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Roadmap: roadmap.md
  - Architecture:
      - Overview: architecture/overview.md
      - Django Apps: architecture/apps.md
      - Data Model: architecture/data-model.md
      - Integrations: architecture/integrations.md
      - Runners: architecture/runners.md
      - Microservices: architecture/microservices.md
      - RBAC & Tenancy: architecture/rbac.md
      - REST APIs: architecture/rest-api.md
      - Hosting: architecture/hosting.md
  - Authentication:
      - How sign-in works: authentication/index.md
      - Set up SSO: authentication/setup-sso.md
      - Internals: authentication/internals.md
  - Plans and limits: plans.md
  - Development: development.md
  - Features:
      - Forms: features/forms.md
  - Subprojects:
      - Overview: subprojects/index.md
      - Azure Hosting Spike:
          - Overview: subprojects/azure-hosting/index.md
          - Infra & Networking: subprojects/azure-hosting/infra-networking.md
          - Terraform & CI/CD: subprojects/azure-hosting/terraform-cicd.md
          - Logging: subprojects/azure-hosting/logging.md
          - Monitoring: subprojects/azure-hosting/monitoring.md
          - Production State: subprojects/azure-hosting/production-state.md
  - Journal: journal.md
